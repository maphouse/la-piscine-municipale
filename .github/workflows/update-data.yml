name: Update pool data

# Scrapes montreal.ca for the current free adult-swim schedules and commits
# data/pools.json when it changes. Runs daily; the "Check if refresh is due"
# step exits early unless today >= nextScrapeDate (the day after the earliest
# period end stored in pools.json), so the full scrape only runs at period
# boundaries. workflow_dispatch always runs the scraper regardless.
on:
  schedule:
    - cron: '0 9 * * *' # 09:00 UTC daily ≈ 05:00 EDT, before any pool opens
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-data
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Check if refresh is due
        id: due
        run: |
          NEXT=$(node -e "try{const d=require('./data/pools.json');process.stdout.write(d.nextScrapeDate||'')}catch(e){process.stdout.write('')}")
          TODAY=$(date -u +%Y-%m-%d)
          if [ -z "$NEXT" ] || [ "$TODAY" \>= "$NEXT" ]; then
            echo "needed=true" >> $GITHUB_OUTPUT
          else
            echo "needed=false" >> $GITHUB_OUTPUT
            echo "Next refresh due $NEXT — skipping today ($TODAY)."
          fi

      - name: Scrape schedules
        if: steps.due.outputs.needed == 'true' || github.event_name == 'workflow_dispatch'
        run: node scripts/scrape.mjs

      - name: Commit if changed
        if: steps.due.outputs.needed == 'true' || github.event_name == 'workflow_dispatch'
        run: |
          if git diff --quiet -- data/pools.json; then
            echo "No schedule changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/pools.json
          git commit -m "data: refresh pool schedules ($(date -u +%Y-%m-%d))"
          git push
