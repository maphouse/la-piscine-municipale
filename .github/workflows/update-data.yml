name: Update pool data

# Scrapes montreal.ca for the current free adult-swim schedules and commits
# data/pools.json when it changes. Runs rarely — the City updates pool schedules
# only at seasonal shifts — plus on demand.
on:
  schedule:
    - cron: '0 9 1,15 * *' # 09:00 UTC on the 1st and 15th of each month
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-data
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Scrape schedules
        run: node scripts/scrape.mjs

      - name: Commit if changed
        run: |
          if git diff --quiet -- data/pools.json; then
            echo "No schedule changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/pools.json
          git commit -m "data: refresh pool schedules ($(date -u +%Y-%m-%d))"
          git push
